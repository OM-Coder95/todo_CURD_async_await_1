<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo CRUD 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container">
        <div class="row">
            <div class="col-md-4 mt-4">
                <div class="card">
                    <div class="card-body">
                        <form id="todoForm">
                            <div class="form-group">
                                <label for="todoName">Enter your Todo:</label>
                                <input id="todoName" type="text" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="isCompleted">Is Completed:</label>
                                <select id="isCompleted" class="form-control">
                                    <option value="yes">Yes</option>
                                    <option value="no">No</option>
                                </select>
                            </div>

                            <button id="addTodoBtn" type="submit" class="btn btn-sm btn-block btn-primary">Add
                                Todo</button>
                            <button id="updateTodoBtn" type="button"
                                class="btn btn-sm btn-block btn-success d-none">Update Todo</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8 mt-4">
                <div class="card">
                    <div class="card-body">
                        <ul id="todoContainer" class="list-group">
                            <!-- <li class="list-group-item d-flex justify-content-between">
                                <div>
                                    <input type="checkbox">
                                    <strong>todo</strong>
                                </div>
                                <div>
                                    <i class="fa-solid fa-pen-to-square fa-2x text-primary"></i>
                                    <i class="fa-solid fa-trash-can fa-2x text-danger"></i>
                                </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="spinner d-none" id="spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="sr-only">Loading...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>

</html>
